<!DOCTYPE html>
<html>
  <head>
    <title>Gomie Placeholder Images</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f5f5f5;
      }
      .placeholder {
        width: 400px;
        height: 300px;
        background: linear-gradient(135deg, #f05a25, #ff6b35);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
        font-weight: bold;
        margin: 20px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      }
      .ceramic {
        background: linear-gradient(135deg, #8b4513, #a0522d);
      }
      .pottery {
        background: linear-gradient(135deg, #cd853f, #deb887);
      }
      .craft {
        background: linear-gradient(135deg, #d2691e, #f4a460);
      }
      .community {
        background: linear-gradient(135deg, #b8860b, #daa520);
      }
      .workshop {
        background: linear-gradient(135deg, #696969, #808080);
      }
      .products {
        background: linear-gradient(135deg, #2f4f4f, #556b2f);
      }
    </style>
  </head>
  <body>
    <h1>Gomie Vietnam Placeholder Images</h1>

    <div class="placeholder ceramic">Pottery Workshop</div>
    <div class="placeholder pottery">Ceramic Products</div>
    <div class="placeholder craft">Community Craft</div>
    <div class="placeholder community">Ceramic Plates</div>
    <div class="placeholder workshop">Pottery Workshop Shelves</div>
    <div class="placeholder products">Ceramic Plates Community</div>
    <div class="placeholder ceramic">Rice Bowl</div>
    <div class="placeholder pottery">Banana Leaf Plate</div>
    <div class="placeholder craft">Ocean Mug</div>

    <p>These are placeholder designs for Gomie Vietnam ceramic products.</p>
  </body>
</html>
